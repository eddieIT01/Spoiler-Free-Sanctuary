[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[context.production]
  environment = { VITE_API_BASE_URL = "YOUR_BACKEND_URL" }

[context.deploy-preview]
  environment = { VITE_API_BASE_URL = "YOUR_BACKEND_URL" }

[context.branch-deploy]
  environment = { VITE_API_BASE_URL = "http://localhost:4000/api" }
